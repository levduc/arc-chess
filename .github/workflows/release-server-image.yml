name: release-server-image
# The self-host server image (deploy/host): ghcr.io/levduc/arc-chess-server. The server and the CLI release together:
# a cli-v<version> tag publishes the npm package (release-cli.yml) and this image, whose version tag is
# packages/cli/package.json's version -- the arc-chess release the image advertises by default.
# - A tag run pushes :<version> and :sha-<commit>, and :latest when <version> is the highest cli-v* tag, checked again
#   right before the push (a patch to an older line, or an overlapping run, never moves :latest back). It refuses to overwrite an existing :<version>, so a version tag, once
#   pushed, always names the same image -- except that a re-run of a tag run whose push went through but whose
#   attestation failed finds :<version> and :sha-<commit> naming one digest, skips the push and attests that digest.
# - A manual run pushes :sha-<commit> only (a test build of the checked-out ref; never :<version> or :latest).
# - Either way, nothing is pushed until arc-chess@<version> is on npm: an image must never tell agents to run a CLI
#   version npm does not have (release-cli.yml runs on the same tag, at the same time).
# Every image gets a registry provenance attestation and an SBOM from BuildKit, and a GitHub build provenance
# attestation:
#   gh attestation verify oci://ghcr.io/levduc/arc-chess-server@<digest> -R levduc/arc-chess
# Only GITHUB_TOKEN is used; no other secret exists for this workflow.
# After the first push, the owner makes the package public once (GitHub > Packages > arc-chess-server > Package
# settings > Change visibility): a new GHCR package is private, and every operator's pull fails until then.
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
env:
  IMAGE: ghcr.io/levduc/arc-chess-server
  CLI_PACKAGE: arc-chess
jobs:
  image:
    # A fork has no write access to this package; it would only fail at the push.
    if: github.repository == 'levduc/arc-chess'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every cli-v* tag, to tell whether this version is the highest (:latest).
          fetch-depth: 0
      - name: The image version is the CLI version (a cli-v<version> tag must match it)
        id: version
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${GITHUB_REF_NAME#cli-v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match packages/cli/package.json's version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built once for this runner and checked before anything is pushed: it runs as a non-root user, refuses Arc
      # mainnet while no mainnet deployment is pinned, and holds no wallet or key file. Its cache feeds the push build.
      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/host/Dockerfile
          build-args: ARENA_CLI_PACKAGE=${{ env.CLI_PACKAGE }}
          load: true
          tags: arena-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          test "$(docker run --rm --entrypoint id arena-server:ci -u)" != 0
          set +e
          out="$(docker run --rm --network none -e DOMAIN=arena.operator.dev -e NETWORK=arc-mainnet arena-server:ci print-config 2>&1)"
          code=$?
          set -e
          echo "$out"
          test "$code" = 1
          echo "$out" | grep -q "this image cannot serve Arc mainnet"
          found="$(docker run --rm --entrypoint sh arena-server:ci -c 'find / -xdev \( -name "wallet*.json" -o -name ".arena*" -o -name "*.key" \) 2>/dev/null')"
          if [ -n "$found" ]; then
            echo "key-like files in the image: $found" >&2
            exit 1
          fi
          test "$(docker run --rm --entrypoint cat arena-server:ci /app/share/assets.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).cli.version')" = "${{ steps.version.outputs.version }}"
      # release-cli.yml publishes arc-chess@<version> from the same tag, at the same time: wait for it, up to 20 minutes.
      # If it never appears (that release failed), nothing is pushed.
      - name: arc-chess@<version> is on npm
        run: |
          want="$CLI_PACKAGE@${{ steps.version.outputs.version }}"
          for i in $(seq 1 40); do
            if [ "$(npm view "$want" version 2>/dev/null)" = "${{ steps.version.outputs.version }}" ]; then
              echo "$want is on npm"
              exit 0
            fi
            echo "$want is not on npm yet ($i/40); waiting 30 s"
            sleep 30
          done
          echo "$want never appeared on npm: an image advertising it would send every agent to a version that does not exist" >&2
          exit 1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: A version tag is pushed once
        id: once
        if: github.event_name == 'push'
        run: |
          # After docker login: authenticated, a tag missing from our own namespace answers "not found".
          ref="$IMAGE:${{ steps.version.outputs.version }}"
          mine_ref="$IMAGE:sha-${{ steps.version.outputs.sha }}"
          if out="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>&1)"; then
            # This commit's own earlier attempt (its push went through, a later step failed): attest it, push nothing.
            mine="$(docker buildx imagetools inspect "$mine_ref" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
            if [ -n "$mine" ] && [ "$mine" = "$out" ]; then
              echo "$ref is this commit's image ($out), pushed by an earlier attempt: attesting it again, pushing nothing"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "digest=$out" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$ref already exists: a version tag always names the same image. Bump packages/cli/package.json's version and tag that" >&2
            exit 1
          fi
          if echo "$out" | grep -qiE "not found|manifest unknown"; then
            echo "$ref is not pushed yet"
            exit 0
          fi
          # A package never pushed can answer 403/denied even to an authenticated inspect. Absent only if this commit's
          # sha tag is absent too; anything else cannot be told apart from a tag we may not see: stop, never overwrite.
          if echo "$out" | grep -qiE "403|forbidden|denied|unauthorized"; then
            if mine_out="$(docker buildx imagetools inspect "$mine_ref" 2>&1)"; then
              echo "$ref answers \"$out\" while $mine_ref exists: cannot tell whether $ref exists" >&2
              exit 1
            fi
            if echo "$mine_out" | grep -qiE "not found|manifest unknown|403|forbidden|denied|unauthorized"; then
              echo "$ref is not pushed yet (the package has never been pushed: $out)"
              exit 0
            fi
            echo "cannot tell whether $ref exists: $out; $mine_ref: $mine_out" >&2
            exit 1
          fi
          echo "cannot tell whether $ref exists: $out" >&2
          exit 1
      # Re-review N-5: :latest only for the highest x.y.z cli-v* tag, decided right before the push. Another tag run
      # (a higher version) may have started since this checkout, so the tags are fetched again here. No concurrency
      # group: one would cancel a pending run and leave its version with no image.
      - name: The tags to push
        id: tags
        if: steps.once.outputs.pushed != 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          {
            echo "tags<<EOF"
            echo "$IMAGE:sha-${{ steps.version.outputs.sha }}"
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "$IMAGE:$version"
              git fetch --quiet --force origin 'refs/tags/cli-v*:refs/tags/cli-v*'
              highest="$(git tag -l 'cli-v*' | sed 's/^cli-v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
              if [ "$version" = "$highest" ]; then
                echo "$IMAGE:latest"
              else
                echo "not moving :latest: cli-v$highest is higher than $version" >&2
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # The final stage has no RUN step and the build stage runs on the runner's own platform, so arm64 needs no
      # emulation.
      - name: Build and push
        id: push
        if: steps.once.outputs.pushed != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/host/Dockerfile
          build-args: ARENA_CLI_PACKAGE=${{ env.CLI_PACKAGE }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          tags: ${{ steps.tags.outputs.tags }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest || steps.once.outputs.digest }}
          push-to-registry: true
      - name: Digest
        run: echo "${{ env.IMAGE }}@${{ steps.push.outputs.digest || steps.once.outputs.digest }} (${{ steps.version.outputs.version }}, sha-${{ steps.version.outputs.sha }})" >> "$GITHUB_STEP_SUMMARY"
