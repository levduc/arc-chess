name: release-cli
on:
  push:
    tags: ["cli-v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # No registry input on setup-node: with one, it writes an .npmrc auth line and fills its token variable with the
          # placeholder XXXXX-XXXXX-XXXXX-XXXXX -- npm then sends that bogus token instead of using trusted
          # publishing's OIDC identity, and the registry answers 404 (cli-v0.1.1's first run). npm's default registry
          # is registry.npmjs.org anyway.
      - name: The tag names the CLI version being published
        run: |
          tag="${GITHUB_REF_NAME#cli-v}"
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match packages/cli/package.json's version $version" >&2
            exit 1
          fi
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cli --release
        env:
          ARENA_CLI_PACKAGE: ${{ vars.ARENA_CLI_PACKAGE }}
          ARENA_CLI_LICENSE: ${{ vars.ARENA_CLI_LICENSE }}
          ARENA_CLI_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
      - run: pnpm --filter @arena/system-tests exec vitest run cli-clean-room.test.ts
        env:
          ARENA_CLEAN_ROOM_DIST: ${{ github.workspace }}/packages/cli/dist
      # Trusted publishing (OIDC): npm trusts this repo's release-cli.yml, configured on the package's npm settings
      # page, so no npm token is stored anywhere. It needs npm >= 11.5.1 and `id-token: write` (above).
      - name: npm is new enough for trusted publishing
        run: |
          v="$(npm --version)"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$v" \
            || { echo "npm $v is older than 11.5.1, which trusted publishing needs" >&2; exit 1; }
      - run: npm publish packages/cli/dist --provenance --access public
