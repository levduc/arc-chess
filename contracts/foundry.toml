[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
  { access = "read", path = "./test/vectors" },
  { access = "read-write", path = "./deployments" },
]

[invariant]
runs = 64
depth = 50
fail_on_revert = false

# Deeper invariant/fuzz sweep, run explicitly via `pnpm test:contracts:deep` (not part of the default
# `pnpm test:contracts` loop, which must stay fast).
[profile.deep.invariant]
runs = 1000
depth = 200
fail_on_revert = false

[profile.deep.fuzz]
runs = 20000
