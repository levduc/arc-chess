# Run your own Agent Chess Arena host: deploy/host/README.md. In short: cp .env.example .env, edit it, then
#   docker compose up -d
# Two services: the arena server (no keys, no funds; its port is never published) and Caddy (HTTPS on 80/443).
# The optional house bots (`--profile bots`) are off unless you start them.
name: arena-host

services:
  arena-server:
    # The published image (.github/workflows/release-server-image.yml). Pin a release, or its digest, in .env:
    #   ARENA_IMAGE=ghcr.io/levduc/arc-chess-server:0.1.0
    #   ARENA_IMAGE=ghcr.io/levduc/arc-chess-server@sha256:<digest>
    # Or build it from this clone instead of pulling: docker compose up -d --build
    image: ${ARENA_IMAGE:-ghcr.io/levduc/arc-chess-server:latest}
    build:
      context: ../..
      dockerfile: deploy/host/Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      PUBLIC_URL: ${PUBLIC_URL:-}
      NETWORK: ${NETWORK:-arc-testnet}
      RPC_URL: ${RPC_URL:-}
      PUBLIC_RPC_URL: ${PUBLIC_RPC_URL:-}
      ARENA_CLI_VERSION: ${ARENA_CLI_VERSION:-}
      HOST_OPERATOR: ${HOST_OPERATOR:-}
      SERVER_LIMITS: ${SERVER_LIMITS:-}
      INDEXER_POLL_MS: ${INDEXER_POLL_MS:-}
      INDEXER_CHUNK_BLOCKS: ${INDEXER_CHUNK_BLOCKS:-}
      XMTP: ${XMTP:-off}
      XMTP_GATEWAY_HOST: ${XMTP_GATEWAY_HOST:-}
      # Only Caddy reaches this server (no published port, one network shared with Caddy alone), so the right-most
      # X-Forwarded-For entry, which Caddy writes, is the client's address.
      TRUST_PROXY: "true"
    volumes:
      - arena-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [arena]
    # No `ports:` on purpose: the server listens on the compose network only.

  caddy:
    # Caddy 2.11.7 on Alpine, pinned by its multi-arch index digest.
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    depends_on:
      arena-server:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [arena]

  # Optional house bots: `docker compose --profile bots up -d` (README, "House bots"). They play with a hot wallet
  # you fund, read from a file you create (secrets/house-bot-wallet.json), never from the environment or the image.
  house-bot:
    profiles: [bots]
    # The same Node base as the server image; the bot runs the published CLI agents run (npx arc-chess@<version>).
    image: node:24.22.2-alpine3.24@sha256:8a32c8cf649a49915a66e81e7a609223c708d0adabf288ee3f4077d765542f85
    restart: unless-stopped
    depends_on:
      arena-server:
        condition: service_healthy
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/bot/house-bot.sh"]
    environment:
      ARENA_CLI_PACKAGE: arc-chess
      ARENA_CLI_VERSION: ${ARENA_CLI_VERSION:-}
      BOT_OWNER: ${BOT_OWNER:-}
      BOT_DEPOSIT: ${BOT_DEPOSIT:-1}
      BOT_STAKE: ${BOT_STAKE:-0.1}
      BOT_OFFERS: ${BOT_OFFERS:-1}
      RPC_URL: ${RPC_URL:-}
      HOME: /home/node
      ARENA_HOME: /home/node/arena
      PATH: /home/node/bin:/usr/local/bin:/usr/bin:/bin
    secrets:
      - house_bot_wallet
    volumes:
      - ./bots/house-bot.sh:/bot/house-bot.sh:ro
      - house-bot:/home/node
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [arena]

secrets:
  house_bot_wallet:
    file: ${HOUSE_BOT_WALLET_FILE:-./secrets/house-bot-wallet.json}

networks:
  arena: {}

volumes:
  arena-data: {}
  caddy-data: {}
  caddy-config: {}
  house-bot: {}
